    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://yusando.com/#organization",
            "name": "株式会社悠三堂",
            "url": "https://yusando.com",
            "logo": "https://yusando.com/logo.png",
            "address": { "@type": "PostalAddress", "addressLocality": "奈良市", "addressRegion": "奈良県", "addressCountry": "JP" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://journal.yusando.com/#app",
            "name": "Finisher Journal",
            "url": "https://journal.yusando.com/login",

          }
        ]

    <script>
      window.GOOGLE_IDS = { site_url: 'https://journal.yusando.com', ga4_measurement_id: 'G-9JG1FFTL1B', ads_conversion_id: '', ads_conversion_labels: {} };
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
      // 本番ドメイン以外では送信しない
      window.__GTAG_ENABLED = location.hostname === new URL(GOOGLE_IDS.site_url).hostname;
      if (window.__GTAG_ENABLED) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GOOGLE_IDS.ga4_measurement_id;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', GOOGLE_IDS.ga4_measurement_id, { send_page_view: true });
      }
      window.trackConversion = function (name, params) {
        params = Object.assign({ site: 'finisher-journal' }, params || {});
        if (!window.__GTAG_ENABLED) return console.debug('[gtag disabled]', name, params);
        gtag('event', name, params);
      };
    </script>
    <!-- ===== Google 標準セット ここまで ===== -->
    <meta name="theme-color" content="#f6f3ec" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #f6f3ec; --surface: #fffdf8; --ink: #2b2a26; --muted: #767268; --line: #e2dccf; --accent: #3d6a4d; --accent-ink: #fff; --warn: #a94f36; }
      @media (prefers-color-scheme: dark) { :root { --bg: #181a18; --surface: #212421; --ink: #ecebe4; --muted: #a3a097; --line: #353933; --accent: #8cc09b; --accent-ink: #13231a; --warn: #e79a82; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; padding: 16px; }
      main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 40px 28px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 16px; }
      h1 { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif; font-weight: 700; font-size: 28px; margin: 0 0 8px; letter-spacing: .02em; }
      p { color: var(--muted); line-height: 1.8; margin: 0 0 28px; font-size: 15px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 18px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 16px; }
      .btn:hover { filter: brightness(1.05); }
      .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .error { color: var(--warn); font-size: 14px; margin: 0 0 16px; min-height: 1em; }
      .dev[hidden] { display: none; }
      .dev { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
      footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon.svg" alt="" width="56" height="56" />
      <h1>Finisher Journal</h1>
      <p>90日の目標と、1日1ページの記録。<br />やりきるためのジャーナル。</p>
      <p class="error" id="error" role="alert"></p>
      <a class="btn" id="login" href="/auth/google">Googleでログイン</a>
      <a class="dev" id="dev" href="/auth/dev" hidden>開発用ログイン（ローカルのみ）</a>
      <footer>株式会社悠三堂</footer>
    </main>
    <script>
      var messages = {
        forbidden: 'このGoogleアカウントでは使えません。許可されたアカウントでログインしてください。',
        denied: 'Googleでのログインがキャンセルされました。',
        state: 'ログインの有効期限が切れました。もう一度お試しください。',
        token: 'Googleとの連携に失敗しました。もう一度お試しください。',
      };
      var err = new URLSearchParams(location.search).get('error');
      if (err) document.getElementById('error').textContent = messages[err] || 'ログインできませんでした。';
      document.getElementById('login').addEventListener('click', function () {
        window.trackConversion('login', { method: 'Google' });
      });
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') document.getElementById('dev').hidden = false;
    </script>
  </body>
</html>
