# 本番（Cloudflare Workers）への自動デプロイ
# 必要な GitHub シークレット: CLOUDFLARE_API_TOKEN（アカウント ID は wrangler.toml に記載）
name: Deploy

on:
  push:
    branches: [main, claude/confident-newton-rvehln]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップしました（README の「自動デプロイ」を参照）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply finisher-journal --remote
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy
