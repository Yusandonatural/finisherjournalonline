name = "finisher-journal"
# Cloudflare のアカウント（秘密情報ではない）
account_id = "f67f1a20dfa6ca21a2f21fb660aad45a"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# フロント（Vite のビルド結果）を同じ Worker から配信する
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "finisher-journal"
# 2026-09-28 作成済み（APAC）。テーブルも作成済み
database_id = "e308539e-720e-43a6-8d25-3012669b1b02"
migrations_dir = "migrations"

# 15分ごと: 期限切れタスクを「できなかった」に更新し、Notion と同期する
[triggers]
crons = ["*/15 * * * *"]

[vars]
APP_TIMEZONE = "Asia/Tokyo"
# 本番URL（Notion に書くリンクに使う）。空なら、実際に開かれた URL を覚えて使う
APP_URL = ""
# 許可するGoogleアカウント（カンマ区切り）
ALLOWED_EMAILS = "isozaki@yusando.com"
# 既存の Notion「🎒 Todo リスト」（MY LIFE OS 内）
NOTION_TASKS_DB_ID = "6ecc0a27e7af4782be9c2b022a75b0e8"
NOTION_JOURNAL_TAG = "目標達成ジャーナル"
NOTION_ASSIGNEE = "礒﨑遼太郎"

# 秘密情報は `npx wrangler secret put <NAME>` で登録する:
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / TOKEN_ENC_KEY / NOTION_TOKEN
